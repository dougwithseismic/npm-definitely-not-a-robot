name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Changelog has a heading for this version
        run: node scripts/release-notes.mjs "v$(node -p 'require("./package.json").version')" > /dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Ubuntu blocks the user namespaces Chrome's sandbox needs. Playwright turns the sandbox off;
      # Puppeteer, as the README runs it, keeps it on.
      - name: Let Chrome's sandbox run
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Types, lint, tests, build
        run: pnpm check
      - name: Install the packed tarball into an empty project and run the README quickstart
        run: pnpm smoke
